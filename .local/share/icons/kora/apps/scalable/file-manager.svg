<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5AC8FA"/>
      <stop offset="0.55" stop-color="#3A8DFF"/>
      <stop offset="1" stop-color="#2F5CF5"/>
    </linearGradient>
    <linearGradient id="sheen" x1="128" y1="0" x2="128" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- purple folder (back left) -->
    <linearGradient id="folderPurple" x1="128" y1="100" x2="128" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C9A6FF"/>
      <stop offset="1" stop-color="#9B6BF0"/>
    </linearGradient>

    <!-- orange folder (back right) -->
    <linearGradient id="folderOrange" x1="128" y1="100" x2="128" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFC876"/>
      <stop offset="1" stop-color="#FF9B3D"/>
    </linearGradient>

    <!-- green folder (middle) -->
    <linearGradient id="folderGreen" x1="128" y1="105" x2="128" y2="195" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7EE0B8"/>
      <stop offset="1" stop-color="#3ECF8E"/>
    </linearGradient>

    <!-- red/front folder -->
    <linearGradient id="folderFront" x1="128" y1="112" x2="128" y2="204" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF8A8A"/>
      <stop offset="1" stop-color="#F0473F"/>
    </linearGradient>

    <clipPath id="squircleClip">
      <path d="M128 8 C 40 8, 8 40, 8 128 C 8 216, 40 248, 128 248 C 216 248, 248 216, 248 128 C 248 40, 216 8, 128 8 Z"/>
    </clipPath>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#14306b" flood-opacity="0.35"/>
    </filter>
    <filter id="folderShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0B1E45" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Squircle base -->
  <g filter="url(#softShadow)">
    <path d="M128 8 C 40 8, 8 40, 8 128 C 8 216, 40 248, 128 248 C 216 248, 248 216, 248 128 C 248 40, 216 8, 128 8 Z" fill="url(#bg)"/>
  </g>

  <g clip-path="url(#squircleClip)">
    <rect x="0" y="0" width="256" height="140" fill="url(#sheen)"/>

    <!-- back-left purple folder, tilted -->
    <g filter="url(#folderShadow)" transform="rotate(-12 90 150)">
      <path d="M52 116h30l9 10h56a7 7 0 0 1 7 7v58a7 7 0 0 1-7 7h-95a7 7 0 0 1-7-7v-68a7 7 0 0 1 7-7z"
            fill="url(#folderPurple)"/>
    </g>

    <!-- back-right orange folder, tilted -->
    <g filter="url(#folderShadow)" transform="rotate(12 166 150)">
      <path d="M128 116h30l9 10h56a7 7 0 0 1 7 7v58a7 7 0 0 1-7 7h-95a7 7 0 0 1-7-7v-68a7 7 0 0 1 7-7z"
            fill="url(#folderOrange)"/>
    </g>

    <!-- middle green folder -->
    <g filter="url(#folderShadow)">
      <path d="M74 122h32l10 11h60a8 8 0 0 1 8 8v62a8 8 0 0 1-8 8h-102a8 8 0 0 1-8-8v-73a8 8 0 0 1 8-8z"
            fill="url(#folderGreen)"/>
    </g>

    <!-- front white folder, main focus -->
    <g filter="url(#folderShadow)">
      <path d="M60 138h34l11 12h68a9 9 0 0 1 9 9v58a9 9 0 0 1-9 9h-113a9 9 0 0 1-9-9v-70a9 9 0 0 1 9-9z"
            fill="url(#folderFront)"/>
    </g>
  </g>
</svg>
